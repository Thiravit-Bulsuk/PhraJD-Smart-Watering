; ระบบรดน้ำต้นไม้ PhraJD
; master  = บอร์ด 1 (บอร์ดหลัก + รีเลย์ปั๊ม 1 ช่อง, ต่อ Wi-Fi/MQTT)
; node_2  = บอร์ด 2 (รีเลย์ 4 ช่อง วาล์ว 1-4)
; node_3  = บอร์ด 3 (รีเลย์ 1 ช่อง วาล์ว 5)
; node_4  = บอร์ด 4 (รีเลย์ 2 ช่อง วาล์ว 6-7)

[platformio]
default_envs = master, node_2, node_3, node_4

[env]
platform = espressif32@^6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = time, esp32_exception_decoder
; ตั้งเป็น 0 ถ้าโมดูลรีเลย์เป็นแบบ Active HIGH
build_flags =
  -D RELAY_ACTIVE_LOW=1

[env:master]
build_src_filter = +<master/>
lib_deps =
  knolleary/PubSubClient@^2.8
  bblanchon/ArduinoJson@^7.2.0
build_flags =
  ${env.build_flags}
  -D NODE_ID=1

[env:node_2]
build_src_filter = +<node/>
build_flags =
  ${env.build_flags}
  -D NODE_ID=2

[env:node_3]
build_src_filter = +<node/>
build_flags =
  ${env.build_flags}
  -D NODE_ID=3

[env:node_4]
build_src_filter = +<node/>
build_flags =
  ${env.build_flags}
  -D NODE_ID=4

; ทดสอบสัญญาณ Wi-Fi เท่านั้น (รีเลย์ของบอร์ด 4 ถูกสั่งปิดไว้): pio run -e wifi_test -t upload -t monitor
[env:wifi_test]
build_src_filter = +<wifi_test/>
build_flags =
  ${env.build_flags}
  -D NODE_ID=4
